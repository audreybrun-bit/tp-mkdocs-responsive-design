image: python:3.12-slim
stages:
  - deploy
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

pages:
  stage: deploy
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install --cache-dir .cache/pip -r requirements.txt
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  only:
    - main
