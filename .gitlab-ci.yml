image: python:3.11
stages:
  - deploy
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
pages:
  stage: deploy
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install --cache-dir .cache/pip -r requirements.txt
  script:
    - mkdocs build
  artifacts:
    paths:
      - site
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
