site_name: Mini site - Les fondamentaux du Web Responsive - IPM
site_description: Base MkDocs Material pour publier un mini site avec GitLab Pages.
site_author: Audrey BRUN, Indiana DUFEIX, Jeanne FANG, Sabrina VASSEUR

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

nav:
 - Accueil: index.md
  - Notions:
      - Media Queries: notions/media-queries.md
      - Bootstrap: notions/bootstrap.md
      - MkDocs Material Responsive: notions/mkdocs-material-responsive.md
      - Analyse: notions/analyse.md
      - YAML: notions/yaml.md

extra_css:
  - css/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
