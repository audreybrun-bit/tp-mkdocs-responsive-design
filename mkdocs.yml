site_name: Mini site - Les fondamentaux du Web Responsive - IPM
site_description: Mini site présentant les fonctionnalités des Media Queries, du responsive design, de Bootstrap et de MkDocs et l'intérêt que cela représente dans la conception de supports numériques pédagogiques.
site_author: Audrey BRUN, Indiana DUFEIX, Jeanne FANG, Sabrina VASSEUR

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: teal
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Accueil: index.md
  - Media Queries: media-queries.md
  - Bootstrap: bootstrap.md
  - MkDocs: mkdocs.md
  - Analyse réflexive: analyse-reflexive.md  
  
  
extra_css:
  - css/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
